{% extends 'base.html' %}
{% block content %}
<div class="container py-4" style="max-width:600px;">
    <h2 class="mb-4" style="font-family:'Caudex',serif;">Editar Álbum</h2>
    <form method="post">
        {% csrf_token %}
        <div class="mb-3">
            <label class="form-label">Nombre</label>
            {{ form.nombre }}
        </div>
        <div class="mb-3">
            <label class="form-label">Descripción</label>
            {{ form.descripcion }}
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
        <a href="{% url 'categoria_lista' %}" class="btn-ghost text-decoration-none ms-2">Cancelar</a>
    </form>
</div>
{% endblock %}
